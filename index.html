<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0nStack — Programmable Infrastructure for RWAs & Fiat</title>
<meta name="description" content="Regulated stablecoin infrastructure and API for Latin America. Convert, settle, tokenize — in minutes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%C3%98</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #f08c00;
    --gold-light: #ffb84d;
    --gold-glow: rgba(240, 140, 0, 0.3);
    --g400: #999;
    --g500: #666;
    --g600: #444;
    --success: #16A34A;
  }

  html { background: #000; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--gold); color: #000; }

  /* Grid background */
  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(240,140,0,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,140,0,0.06) 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: 0.5;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 70%);
  }

  /* Glows */
  .glow-center {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(240,140,0,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  .glow-top {
    position: fixed;
    top: -300px; left: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(240,140,0,0.025) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Scan line */
  .scan-line {
    position: fixed;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,140,0,0.15), transparent);
    animation: scan 8s linear infinite;
    pointer-events: none;
  }

  @keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
  }

  /* Content */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px;
    max-width: 640px;
  }

  /* Logo */
  .logo {
    font-family: 'Oxanium', sans-serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 700;
    letter-spacing: 0.3em;
    color: #fff;
    margin-bottom: 48px;
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .logo .o { color: var(--gold); }

  /* Divider */
  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,140,0,0.5), transparent);
    margin-bottom: 40px;
    animation: scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(240,140,0,0.2);
    background: rgba(240,140,0,0.04);
    padding: 10px 20px;
    border-radius: 100px;
    margin-bottom: 32px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
  }

  .badge-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--gold);
  }

  .pulse-dot {
    position: relative;
    width: 8px; height: 8px;
  }

  .pulse-dot::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--gold);
    animation: ping 1.5s cubic-bezier(0,0,0.2,1) infinite;
  }

  .pulse-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--gold);
  }

  @keyframes ping {
    75%, 100% { transform: scale(2.5); opacity: 0; }
  }

  /* Headlines */
  .headline {
    font-family: 'Oxanium', sans-serif;
    font-size: clamp(1.2rem, 3.5vw, 1.9rem);
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: #fff;
    margin-bottom: 20px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
  }

  .headline .sub {
    font-weight: 300;
    color: var(--g400);
  }

  .description {
    font-size: clamp(0.85rem, 2vw, 1rem);
    color: var(--g400);
    max-width: 440px;
    line-height: 1.7;
    font-weight: 300;
    margin-bottom: 48px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both;
  }

  /* Buttons */
  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Oxanium', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    padding: 14px 28px;
    text-decoration: none;
    transition: all 0.3s;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--gold);
    color: #000;
    border: none;
  }

  .btn-primary:hover {
    background: var(--gold-light);
    box-shadow: 0 0 30px var(--gold-glow);
  }

  .btn-secondary {
    background: transparent;
    color: var(--g500);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .btn-secondary:hover {
    color: var(--gold);
    border-color: rgba(240,140,0,0.3);
  }

  /* Corner labels */
  .corner {
    position: fixed;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--g600);
    letter-spacing: 0.15em;
    z-index: 10;
  }

  .corner-tl { top: 24px; left: 24px; }
  .corner-tr { top: 24px; right: 24px; }
  .corner .slash { color: rgba(240,140,0,0.4); }

  /* Status bar */
  .status-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 48px;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    z-index: 20;
    animation: fadeIn 1s 1.5s both;
  }

  .status-inner {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--g500);
  }

  .status-left { display: flex; align-items: center; gap: 8px; }
  .status-center { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .status-right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: pulse-glow 2s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .text-gold { color: var(--gold); }
  .text-white { color: #fff; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scaleX(0); }
    to { opacity: 1; transform: scaleX(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 640px) {
    .corner { display: none; }
    .status-inner { font-size: 9px; padding: 0 16px; }
    .buttons { flex-direction: column; align-items: stretch; }
    .btn { justify-content: center; }
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="glow-center"></div>
  <div class="glow-top"></div>
  <div class="scan-line"></div>

  <div class="corner corner-tl"><span class="slash">//</span> 0nstack.io</div>
  <div class="corner corner-tr">v0.1.0</div>

  <div class="content">
    <div class="logo"><span class="o">&Oslash;</span>NSTACK</div>

    <div class="divider"></div>

    <div class="badge">
      <span class="pulse-dot"></span>
      <span class="badge-text">Coming Soon</span>
    </div>

    <h1 class="headline">
      Programmable Infrastructure<br>
      <span class="sub">for RWAs & Fiat</span>
    </h1>

    <p class="description">
      We're building the regulated API that will power stablecoin conversions,
      cross-border settlements, and RWA tokenization across Latin America.
    </p>

    <div class="buttons">
      <a href="mailto:contact@0nstack.io" class="btn btn-primary">Get in Touch</a>
      <a href="/example" class="btn btn-secondary">Preview Design</a>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-inner">
      <div class="status-left">
        <span class="status-dot"></span>
        <span>Building</span>
      </div>
      <div class="status-center">
        <span>Status:</span>
        <span class="text-gold">In Development</span>
      </div>
      <div class="status-right">
        <span>2025</span>
      </div>
    </div>
  </div>

</body>
</html>
